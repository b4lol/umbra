# cargo-deny configuration: license, ban, and source policy for Umbra.
# GPL-3.0-or-later is the project license (docs/PROJECT.md); dependencies must be
# permissively licensed or GPL-compatible.

[graph]
all-features = true

[licenses]
version = 2
allow = [
    "GPL-3.0-or-later",
    "GPL-2.0-or-later",
    "LGPL-3.0-or-later",
    # equix/hashx (hs-pow-full, TODO A.2) are LGPL-3.0-ONLY: GPL-3.0-compatible
    # per FSF; pure Rust (no ADR-011 conflict). Statically linked into a
    # GPL-3.0-or-later work, the LGPL grant is subsumed by the GPL offer.
    "LGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
    # async_executors (via tor-rtcompat / arti-client); public-domain grant,
    # GPL-compatible (FSF/OSI approved).
    "Unlicense",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
deny = []

[advisories]
version = 2
yanked = "warn"
# Transitive through the optional `tor` feature (arti-client 0.45 tree):
# - RUSTSEC-2024-0436 (paste): unmaintained, no replacement upstream; the
#   proc-macro is build-time only and not exposed in Umbra code paths.
# - RUSTSEC-2023-0071 (rsa): Marvin timing attack in the `rsa` crate, pulled
#   by Tor's protocol-mandated RSA-1024 identity keys; Umbra never uses RSA
#   for its own cryptography. Revisit on every dependabot arti bump.
# Transitive through `umbra-group` (TODO B.2, ADR-033):
# - RUSTSEC-2026-0173 (proc-macro-error2): unmaintained (an unmaintained
#   advisory, not a vulnerability), pulled by Cryspen's `hax-lib-macros`
#   ← `libcrux-intrinsics` ← the libcrux family ← `openmls_libcrux_crypto`
#   ← `openmls` — the formally-verified pure-Rust crypto provider ADR-033
#   selected. No replacement exists upstream (`hax-lib-macros` 0.3.7 is the
#   latest semver-compatible release and still depends on it; dropping it
#   would mean dropping libcrux/OpenMLS entirely). Build-time proc-macro
#   only, never present in Umbra's runtime code paths. Revisit on every
#   openmls/libcrux bump.
ignore = ["RUSTSEC-2024-0436", "RUSTSEC-2023-0071", "RUSTSEC-2026-0173"]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
