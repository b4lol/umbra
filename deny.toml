# cargo-deny configuration: license, ban, and source policy for Umbra.
# GPL-3.0-or-later is the project license (PROJECT.md); dependencies must be
# permissively licensed or GPL-compatible.

[graph]
all-features = true

[licenses]
version = 2
allow = [
    "GPL-3.0-or-later",
    "GPL-2.0-or-later",
    "LGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
deny = []

[advisories]
version = 2
yanked = "warn"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
