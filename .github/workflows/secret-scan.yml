# Secret scanning: no credential, key, or operational secret may ever reach
# the repository. This workflow fails the check (blocking PR merge via branch
# protection) if gitleaks finds anything in the FULL history of the ref —
# plus a weekly scheduled re-scan, because gitleaks' ruleset evolves and a
# pattern not caught last month may be caught today.
#
# Push-TIME prevention is a separate layer: GitHub's own secret-scanning push
# protection is enabled on the repository (rejects the push before it lands).
#
# What this workflow deliberately does NOT do: rewrite history. If a real
# secret ever lands, the response is the manual procedure in SECURITY.md
# ("If a secret reaches the repository") — rotate first, then rewrite — never
# an automated force-push from CI.
name: Secret Scanning

on:
  push:
  pull_request:
  schedule:
    # Weekly full-history re-scan (Mondays, off-peak minute).
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: a secret leaked three commits ago must still fail
          # the scan, not only the tip.
          fetch-depth: 0

      - name: Install pinned gitleaks (SHA256-verified)
        # Pinned release binary with checksum verification — no
        # third-party action in the supply chain (same threat posture as
        # the rest of this repository's CI).
        run: |
          set -euo pipefail
          VERSION=8.30.1
          SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan full history for secrets
        # --redact: a found secret is NEVER printed into CI logs.
        run: gitleaks git . --redact --exit-code 1
