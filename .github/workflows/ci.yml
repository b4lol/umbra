name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: fmt + clippy + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
      # TODO A.4: `-Z zero-call-used-regs=all` hardened profile gates here
      # once the nightly CI profile lands (ADR-025).

  supply-chain:
    name: deny + audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      - run: cargo deny check
      - run: cargo audit

  fuzz:
    name: fuzz smoke (packet parser)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Override the pinned rust-toolchain.toml (stable) — libFuzzer needs nightly.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Fuzz the 1024-byte packet parser (60s smoke)
        run: cargo fuzz run fuzz_packet_parser -- -max_total_time=60

  sanitizers:
    name: ASan + UBSan (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Override the pinned rust-toolchain.toml (stable) — `-Zsanitizer`
      # requires the nightly compiler.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: sanitizers
      - name: AddressSanitizer
        run: |
          RUSTFLAGS="-Zsanitizer=address" cargo test --workspace --all-targets \
            --target x86_64-unknown-linux-gnu
      - name: UndefinedBehaviorSanitizer
        run: |
          RUSTFLAGS="-Zsanitizer=undefined" cargo test --workspace --all-targets \
            --target x86_64-unknown-linux-gnu
