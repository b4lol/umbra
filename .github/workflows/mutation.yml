name: Mutation Testing

on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 03:00 UTC — full-tree mutation scanning is too
    # expensive for pull requests (CODE_MANIFESTO §9, TODO A.5).
    - cron: "0 3 * * 1"

jobs:
  mutants:
    name: cargo-mutants
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: mutants
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: Run mutation scan
        run: cargo mutants --no-shuffle
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutants-report
          path: mutants.out
          retention-days: 14
