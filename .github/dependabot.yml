version: 2
updates:
  # Supply-chain discipline (ADR-020): keep dependencies current and
  # RUSTSEC-scanned. Cargo lockfile is committed.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    groups:
      fuzz-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The dtolnay/rust-toolchain action ref IS a Rust toolchain version;
      # the toolchain is pinned by rust-toolchain.toml instead. Dependabot
      # once bumped it to a nonexistent release (404 on static.rust-lang.org).
      - dependency-name: "dtolnay/rust-toolchain"
