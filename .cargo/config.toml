# Cargo build configuration for the Umbra workspace.
#
# ADR-025 mandates LLVM `-Z zero-call-used-regs=all` (register zeroing on
# function return). That flag is nightly-only; it will be applied by the
# hardened nightly CI profile when it lands (TODO A.4). It is intentionally
# NOT set here so that the stable toolchain builds stay reproducible.

[alias]
# Verify the entire workspace including tests and examples.
checkall = "check --workspace --all-targets"

[env]
# TODO B.3 (umbra-hwkey): points SoftHSM2's own config-loading at a
# fixture file scoped to this workspace, so umbra-hwkey's hermetic
# PKCS#11 test gets an isolated token store rather than touching the
# system's real /etc/softhsm2.conf. Set here (Cargo's own env
# mechanism) rather than via `std::env::set_var` in test code, because
# that call is `unsafe` on this toolchain and this workspace forbids
# `unsafe_code` even in tests.
#
# `force = true` is required, not cosmetic: without it, Cargo's default
# lets an ALREADY-set `SOFTHSM2_CONF` in a developer's own shell win
# over this fixture path, silently breaking the test's hermeticity —
# the test would then touch whatever ambient SoftHSM2 token store that
# shell variable pointed at (potentially a developer's real, populated
# token store, since `first_token_slot` just takes slot `[0]`) instead
# of the isolated fixture one, while still reporting `ok`.
SOFTHSM2_CONF = { value = "crates/umbra-hwkey/tests/fixtures/softhsm2-test.conf", relative = true, force = true }
