# Umbra — Cargo Workspace
#
# Layout and scope follow `TODO.md` Section A (ADR-027) and the crate policy in
# `CONTRIBUTING.md`: business logic, crypto, network, and protocol crates are
# `#![forbid(unsafe_code)]`; `unsafe` exists only in `crates/umbra-hardware`.
#
# NOTE: built with Edition 2024 (current stable syntax) on rustc 1.97.1. The
# documentation nominally says "Rust (2021 Edition)"; the workspace targets the
# current edition per project direction.

[workspace]
resolver = "3"
members = [
    "crates/umbra-crypto",
    "crates/umbra-protocol",
    "crates/umbra-net",
    "crates/umbra-cli",
    "crates/umbra-ffi",
    "crates/umbra-gui",
    "crates/umbra-hardware",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0-alpha"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-or-later"
publish = false

# CODE_MANIFESTO §2/§3/§4: Safe Rust, zero panic, zero assumptions, mandatory docs.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
missing_docs_in_private_items = "deny"
undocumented_unsafe_blocks = "deny"

[workspace.dependencies]
# Internal crates
umbra-crypto = { path = "crates/umbra-crypto" }
umbra-protocol = { path = "crates/umbra-protocol" }
umbra-net = { path = "crates/umbra-net" }

# Post-quantum cryptography (RustCrypto, pure Rust — ADR-026)
ml-kem = { version = "0.3.2", features = ["zeroize"] }
ml-dsa = { version = "0.1.1", features = ["zeroize"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
chacha20poly1305 = { version = "0.11.0", features = ["alloc", "rand_core"] }

# Shared RustCrypto trait/type vocabulary (Key, KeyInit, KeySizeUser)
crypto-common = "0.2.2"

# Hashing / KDF (CRYPTOGRAPHY.md §1)
hkdf = "0.13.0"
sha2 = "0.11.0"
blake3 = "1.8.7"
argon2 = "0.6.0"

# Constant-time and memory hygiene
subtle = "2.6.1"
zeroize = { version = "1.9.0", features = ["derive", "alloc", "simd"] }

# Kernel FFI (umbra-hardware: mlock/mprotect/madvise, ADR-012)
libc = "0.2.189"

# Landlock LSM sandboxing (TODO A.4, ADR-007)
landlock = "0.4.7"

# Randomness (getrandom 0.4 / rand_core 0.10 — TryCryptoRng era)
getrandom = "0.4.3"
rand_core = "0.10.1"

# SMP big-integer arithmetic (OTR v3 protocol, TODO A.3)
num-bigint = "0.4.8"
num-traits = "0.2.19"

# Async runtime
tokio = { version = "1.53.1", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "sync",
    "net",
    "time",
    "io-util",
] }

# Errors
thiserror = "2.0.20"

# CLI / TUI front ends
clap = { version = "4.6.6", features = ["derive"] }
ratatui = "0.30.2"
crossterm = "0.29.0"

# Property-based testing (TODO A.5)
proptest = "1.11.0"

# OS_OPTIMIZATIONS.md §3: minimal binary, fat LTO, no unwinding tables.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Cryptography is latency-critical: speed-optimized while everything else
# is size-optimized (OS_OPTIMIZATIONS.md §3).
[profile.release.package.umbra-crypto]
opt-level = 3
