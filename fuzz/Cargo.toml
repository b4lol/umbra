[package]
name = "umbra-fuzz"
description = "libFuzzer targets for Umbra parsers (CONTRIBUTING §5-6)"
version = "1.0.0-alpha.1"
edition = "2024"
publish = false

[dependencies]
libfuzzer-sys = "0.4"
umbra-protocol = { path = "../crates/umbra-protocol" }

[[bin]]
name = "fuzz_packet_parser"
path = "fuzz_targets/fuzz_packet_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_media_sterilizer"
path = "fuzz_targets/fuzz_media_sterilizer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_media_assembler"
path = "fuzz_targets/fuzz_media_assembler.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_smp_wire"
path = "fuzz_targets/fuzz_smp_wire.rs"
test = false
doc = false
bench = false

# Required marker for `cargo fuzz run` to recognize this scaffold.
[package.metadata]
cargo-fuzz = true

# The fuzz tree is its own workspace so libFuzzer's C toolchain never
# contaminates the main workspace build.
[workspace]
