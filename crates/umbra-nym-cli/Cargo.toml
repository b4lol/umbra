[workspace]

[package]
name = "umbra-nym-cli"
description = "Umbra Nym Mixnet adapter: a standalone CLI reusing Umbra's PQXDH session and peer-record infrastructure over Nym's mixnet (TODO B.1). Kept as its own Cargo workspace deliberately — nym-sdk's SQLite dependency chain conflicts with the main workspace's Tor feature via Cargo's `links` uniqueness rule; see ADR-032 in docs/DECISIONS.md."
version = "1.0.0-alpha.3"
edition = "2021"
rust-version = "1.87.0"
license = "GPL-3.0-or-later"
publish = false

[lints.rust]
# Mirrors the main workspace's [workspace.lints.rust] exactly (repo root
# Cargo.toml). This crate is a separate Cargo workspace, so it inherits
# nothing from the root and must restate them.
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
# Mirrors the main workspace's [workspace.lints.clippy] exactly (repo root
# Cargo.toml, verified 2026-09-06).
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
missing_docs_in_private_items = "deny"
undocumented_unsafe_blocks = "deny"

[lib]
name = "umbra_nym_cli"
path = "src/lib.rs"

[[bin]]
name = "umbra-nym"
path = "src/main.rs"

[dependencies]
umbra-net = { path = "../umbra-net" }
umbra-crypto = { path = "../umbra-crypto" }
umbra-cli = { path = "../umbra-cli" }
umbra-hardware = { path = "../umbra-hardware" }
nym-sdk = "=1.21.6"
# Exactly the feature set the main workspace's root Cargo.toml selects —
# NOT "full", which drags in `process`/`signal` support this binary has
# no use for (it bans `execve` via Seccomp in the first place).
tokio = { version = "1.53.1", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "sync",
    "net",
    "time",
    "io-util",
] }
clap = { version = "4.6.6", features = ["derive"] }
seccompiler = "0.5.0"
libc = "0.2.189"
zeroize = { version = "1.9.0", features = ["derive", "alloc", "simd"] }
futures = "0.3"
base64 = "0.22.1"

[dev-dependencies]
# TODO B.2.4: the group-inbound hermetic test builds a REAL Welcome
# frame (`umbra_group::create`/`add`/`keypackage`) to drive through
# `bridge::receive_via_nym`'s group branch, mirroring `umbra-cli`'s own
# `mesh_serve.rs` test. Test-only: `umbra-group` has no SQLite/Tor
# dependency of its own (it depends on `openmls`/`openmls_libcrux_crypto`,
# not the sqlite-provider ADR-032/033 ruled out), so this does not
# reintroduce the `links = "sqlite3"` conflict this crate's own
# `[package]` doc comment explains splitting it off to avoid.
umbra-group = { path = "../umbra-group" }
