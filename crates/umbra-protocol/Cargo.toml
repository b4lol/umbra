[package]
name = "umbra-protocol"
description = "Umbra wire protocol: 1024-byte fixed packets, Poisson cover traffic, SAS verification, typestate sessions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
umbra-crypto.workspace = true
getrandom.workspace = true
subtle.workspace = true
zeroize.workspace = true
blake3.workspace = true
sha2.workspace = true
num-bigint.workspace = true
num-traits.workspace = true
thiserror.workspace = true

# Media metadata sterilizer (TODO A.3): decode common chat-media formats,
# re-encode PNG only. No rayon: deterministic output.
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "gif",
] }

[dev-dependencies]
proptest.workspace = true
# Craft metadata-carrying PNGs for the sterilizer tests.
png = "0.18.1"
