[package]
name = "umbra-engine"
description = "Umbra secret-handling Engine process (TODO B.3.1): sandboxed keystore/decoy-vault unlock served over AF_UNIX to umbra-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "umbra_engine"
path = "src/lib.rs"

[[bin]]
name = "umbra-engine"
path = "src/main.rs"

[dependencies]
# `tor`: TODO B.3 GUI messaging design, Phase 2's background bootstrap
# task calls `umbra_cli::serve::wait_for_address` (gated behind this
# feature on `umbra-cli` itself) and `umbra_net::tor::TorTransport`
# directly (see the `umbra-net` dependency below).
umbra-cli = { workspace = true, features = ["tor"] }
umbra-crypto.workspace = true
umbra-net = { workspace = true, features = ["tor"] }
umbra-hardware = { path = "../umbra-hardware" }
umbra-hwkey = { path = "../umbra-hwkey" }
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
thiserror.workspace = true
tokio.workspace = true
