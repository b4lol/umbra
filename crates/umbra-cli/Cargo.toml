[package]
name = "umbra-cli"
description = "Umbra command-line front end: Unix-philosophy pipes (ADR-022) and the Ratatui TUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "umbra_cli"
path = "src/lib.rs"

[[bin]]
name = "umbra"
path = "src/main.rs"

[dependencies]
umbra-crypto.workspace = true
umbra-protocol.workspace = true
umbra-net.workspace = true
umbra-hardware = { path = "../umbra-hardware" }
zeroize.workspace = true
clap.workspace = true
ratatui.workspace = true
crossterm.workspace = true
landlock.workspace = true
seccompiler = "0.5.0"
libc.workspace = true
thiserror.workspace = true
