[package]
name = "umbra-cli"
description = "Umbra command-line front end: Unix-philosophy pipes (ADR-022) and the Ratatui TUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "umbra_cli"
path = "src/lib.rs"

[[bin]]
name = "umbra"
path = "src/main.rs"

[features]
default = []
# `serve`: inbound Tor onion-service flow (production call site for the
# persistent-identity + sandbox-exception mechanisms, TODO A.2).
tor = ["umbra-net/tor"]
# Wi-Fi Direct off-grid mesh transport (TODO B.1): the Landlock/Seccomp
# sandbox exceptions for the mesh control sockets used by the mesh
# `send`/`serve` flows (mirroring the `tor` feature above). No new
# CLI-crate dependencies beyond that (landlock is already a hard
# dependency of this crate).
mesh = ["umbra-net/mesh"]

[dependencies]
umbra-crypto.workspace = true
umbra-protocol.workspace = true
umbra-net.workspace = true
# Was optional (gated behind `tor`/`mesh`) until Task 8 (`umbra group
# add`): `umbra_group::add::add_member` is `pub async fn` (delivers
# Commit/Welcome frames over a caller-supplied async `connect` closure,
# per Task 7's design), so driving it from this crate's synchronous CLI
# dispatch needs a Tokio runtime UNCONDITIONALLY, not only under
# `tor`/`mesh` — `umbra-group` and `umbra-net` already pull tokio into
# the build graph as a hard dependency regardless of these features, so
# this stops gating an already-unconditionally-present crate rather
# than adding a new one.
tokio.workspace = true
umbra-hardware = { path = "../umbra-hardware" }
umbra-group = { path = "../umbra-group" }
zeroize.workspace = true
base64 = "0.23.1"
clap.workspace = true
ratatui.workspace = true
crossterm.workspace = true
landlock.workspace = true
seccompiler = "0.5.0"
# D-Bus masked notifications (TODO A.4, ADR-018): pure-Rust zbus with the
# blocking API; no external C bus libraries (ADR-011).
zbus = { version = "5.19.0", default-features = false, features = [
    "blocking-api",
    "tokio",
] }
zvariant = { version = "5", default-features = false }
libc.workspace = true
thiserror.workspace = true
