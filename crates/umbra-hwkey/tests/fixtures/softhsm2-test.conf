# SoftHSM2 config fixture for umbra-hwkey's hermetic test (TODO B.3).
# Points at an isolated token store under /tmp, separate from this
# host's real /etc/softhsm2.conf. The tokendir path here MUST match
# TOKEN_DIR in tests/hermetic_softhsm.rs exactly.

directories.tokendir = /tmp/umbra-hwkey-softhsm-test-tokens
objectstore.backend = file
objectstore.umask = 0077
log.level = ERROR
slots.removable = false
slots.mechanisms = ALL
library.reset_on_fork = false
