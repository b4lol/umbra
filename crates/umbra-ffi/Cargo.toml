[package]
name = "umbra-ffi"
description = "UniFFI bridge surface between the Umbra Rust core and Kotlin/Compose (docs/SPECIFICATION.md §3)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "umbra_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
umbra-cli.workspace = true
umbra-crypto.workspace = true
umbra-protocol.workspace = true
thiserror.workspace = true
umbra-net = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
uniffi = { version = "0.32.1", features = ["cli"] }

[features]
default = []
# Live Tor session (TODO B.4 Phase 2). Off by default so the default host build
# and its tests are unchanged; the Android Gradle build turns it on.
tor = ["umbra-cli/tor", "dep:umbra-net", "dep:tokio", "dep:zeroize"]
